@if (libro()) {
  <div class="detalle-container">
    <div class="imagen-section">
      <img [src]="libro().imagenurl" [alt]="libro().nombre"> <!-- imagenurl en minúscula, igual que el modelo -->
    </div>

    <div class="info-section">
      <h1>{{ libro().nombre }}</h1>
      <p class="autor">{{ libro().autor }}</p>
      <p class="sinopsis">{{ libro().sinopsis }}</p>
      <p class="editorial"><strong>Editorial:</strong> {{ libro().editorial }}</p>

      <div class="tags-container">
        @for (tag of libro().tags; track tag) {
          <span class="tag">{{ tag }}</span>
        }
      </div>

      <div class="compra-section">
        <p class="precio">${{ libro().precio }}</p>
        <p class="stock">{{ libro().stock > 0 ? libro().stock + ' en Stock' : 'Sin stock' }}</p>
        <button class="btn-carrito" [disabled]="libro().stock === 0">
          Añadir al Carrito
        </button>
      </div>
    </div>
  </div>
