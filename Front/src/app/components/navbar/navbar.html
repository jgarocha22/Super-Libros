<nav class="navbar-container">
  
  <div class="navbar-logo" routerLink="/catalogo">SuperLibros</div>

  <div class="navbar-search-container">
    <input type="text" placeholder="Busca por Título, Autor, o Categoría..." class="search-input">
    <span class="search-icon">
      <img src="assets/icons/search.svg" alt="Icono de Busqueda">
    </span>
  </div>

  <div class="navbar-actions">
    <div class="auth-row">
      
      @if (!loginService.currentUser()) {
        <button class="btn-login" routerLink="/login">
          <img src="assets/icons/login.svg" alt="Login icon"> INICIAR SESIÓN
        </button>

        <button class="btn-register" routerLink="/registro">REGISTRARSE</button>
      }
      @else {
        <div class="user-profile" routerLink="/perfil">
          <img *ngIf="loginService.currentUser().fotoPerfil; else soloInicial" 
               [src]="loginService.currentUser().fotoPerfil" alt="Perfil" class="avatar-img">
          
          <ng-template #soloInicial>
            <div class="avatar-fallback">{{ inicialUsuario }}</div>
          </ng-template>
          
          <span class="username-text">{{ loginService.currentUser().username | uppercase }}</span>
        </div>
        
        <button class="btn-logout" (click)="cerrarSesion()">
          <img src="assets/icons/logOut.svg" alt="logout icon"> CERRAR SESIÓN
        </button>
      }

    </div>

    <div class="cart-row">
      <button class="btn-cart" (click)="manejarClickCarrito()">
        <img src="assets/icons/shopping_cart.svg" alt="carrito icon"> <span class="cart-text">CARRITO</span>
      </button>
    </div>
  </div>
</nav>
